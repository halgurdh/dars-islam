<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0f0a" />
    <title>Terms of Service · dars-islam</title>
    <link rel="icon" type="image/png" href="__VITE_BASE_PATH__games/asma-match/assets/icons/icon-512.png" />
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .site-header {
        width: 100%;
        border-bottom: 1px solid var(--border-color);
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .site-header__brand {
        font-size: 0.9rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: linear-gradient(135deg, #ff0055, #ff6b35);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-decoration: none;
      }

      .site-header__back {
        font-size: 0.85rem;
        color: var(--text-secondary);
        text-decoration: none;
        transition: color 0.15s;
        margin-right: 3.5rem; /* clear of fixed theme toggle */
      }
      .site-header__back:hover { color: #ff0055; }

      .content {
        width: 100%;
        max-width: 720px;
        padding: 3rem 2rem 5rem;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      .content > header {
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 1.5rem;
      }

      .content > header h1 {
        font-size: 2rem;
        font-weight: 900;
        letter-spacing: 0.02em;
        margin-bottom: 0.4rem;
        color: var(--text-primary);
      }

      .content > header p {
        font-size: 0.82rem;
        color: var(--text-muted);
      }

      section {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }

      h2 {
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #ff0055;
      }

      p, li {
        font-size: 0.92rem;
        color: var(--text-secondary);
        line-height: 1.75;
      }

      ul {
        padding-left: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }

      a { color: var(--accent-light); text-decoration: none; }
      a:hover { text-decoration: underline; }

      @media (max-width: 500px) {
        .content { padding: 2rem 1.25rem 4rem; }
        .site-header { padding: 0.9rem 1.25rem; }
        .content > header h1 { font-size: 1.6rem; }
        .site-header__back { margin-right: 3rem; }
      }
    </style>
    <script type="module">
      import '@shared/theme.css';
    </script>
  </head>
  <body>
    <header class="site-header">
      <a href="__VITE_BASE_PATH__" class="site-header__brand">dars-islam</a>
      <div id="langPicker" style="margin:0 8px"></div>
      <a href="__VITE_BASE_PATH__" class="site-header__back" id="backLink">← Back to games</a>
    </header>

    <main class="content">
      <header>
        <h1 id="pageTitle">Terms of Service</h1>
      </header>

      <div id="sections"></div>
    </main>

    <script type="module">
      import { renderLanguagePickerDom } from '@shared/language-picker-dom';
      import { t } from '../legal-i18n';
      import { getLang, setLang, detectDefaultLang } from '../systems/Locale';

      const MAILTO = '<a href="mailto:halgurdh@gmail.com">halgurdh@gmail.com</a>';
      const siteRoot = typeof __SITE_BASE_PATH__ !== 'undefined' ? __SITE_BASE_PATH__ : '/';

      function render() {
        const s = t();
        document.getElementById('backLink').textContent = s.backToGames;
        document.getElementById('pageTitle').textContent = s.termsTitle;
        const privacyLink = `<a href="${siteRoot}privacy">${s.privacyTitle}</a>`;
        const sections = [...s.termsSections, { heading: s.contactHeading, bodyHtml: `<p>${s.termsContactBody.replace('{{MAILTO}}', MAILTO)}</p>` }];
        document.getElementById('sections').innerHTML = sections.map((sec) => `
          <section>
            <h2>${sec.heading}</h2>
            ${sec.bodyHtml.replace('{{PRIVACY_LINK}}', privacyLink).replace('{{MAILTO}}', MAILTO)}
          </section>`).join('');
      }

      function renderLangPicker() {
        const container = document.getElementById('langPicker');
        if (!container) return;
        renderLanguagePickerDom(container, getLang(), (lang) => {
          setLang(lang);
          renderLangPicker();
          render();
        });
      }

      renderLangPicker();
      render();
      void detectDefaultLang().then(() => { renderLangPicker(); render(); });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0f0a" />
    <title>My Dashboard · dars-islam</title>
    <link rel="icon" type="image/png" href="__VITE_BASE_PATH__games/asma-match/assets/icons/icon-512.png" />
    <style>
      body { display: flex; flex-direction: column; align-items: center; }

      .site-header {
        width: 100%;
        border-bottom: 1px solid var(--border-color);
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        box-sizing: border-box;
      }
      .site-header__brand {
        font-size: 0.9rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: linear-gradient(135deg, #ff0055, #ff6b35);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-decoration: none;
      }
      .site-header__back {
        font-size: 0.85rem;
        color: var(--text-secondary);
        text-decoration: none;
        margin-right: 3.5rem;
      }
      .site-header__back:hover { color: #ff0055; }

      .content {
        width: 100%;
        max-width: 760px;
        padding: 2.5rem 1.5rem 5rem;
        display: flex;
        flex-direction: column;
        gap: 1.75rem;
        box-sizing: border-box;
      }

      .content > header h1 { font-size: 1.9rem; font-weight: 900; color: var(--text-primary); margin-bottom: 0.3rem; }
      .content > header p { font-size: 0.88rem; color: var(--text-muted); }

      .card {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 1.25rem 1.4rem;
      }

      .card h2 {
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #ff0055;
        margin-bottom: 0.9rem;
      }

      .level-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .level-big { font-size: 1.4rem; font-weight: 900; color: #ffb020; }
      .streak-big { font-size: 1rem; font-weight: 700; color: #ff8a3d; }
      .xp-bar { width: 100%; height: 12px; background: var(--border-color); border-radius: 6px; overflow: hidden; margin-top: 12px; }
      .xp-fill { height: 100%; background: linear-gradient(90deg, #ffb347, #ffd700); border-radius: 6px; }
      .sub { font-size: 0.82rem; color: var(--text-muted); margin-top: 6px; }

      .class-card p { font-size: 0.92rem; color: var(--text-secondary); margin: 0.2rem 0; }
      .class-card strong { color: var(--text-primary); }

      .join-form { display: flex; flex-direction: column; gap: 8px; }
      .join-form-row { display: flex; gap: 8px; flex-wrap: wrap; }
      .join-form input {
        flex: 1; min-width: 140px; background: var(--bg-primary); color: var(--text-primary);
        border: 1px solid var(--border-color); border-radius: 8px; padding: 9px 12px; font-size: 0.9rem; box-sizing: border-box;
      }
      .join-form button, .card button {
        background: var(--accent); color: #fff; border: none; border-radius: 8px;
        padding: 9px 16px; font-size: 0.88rem; font-weight: 700; cursor: pointer;
      }
      .join-form button:hover, .card button:hover { filter: brightness(1.1); }
      .join-note { font-size: 0.76rem; color: var(--text-muted); }
      .form-msg { font-size: 0.82rem; min-height: 1.2em; }
      .form-msg--error { color: #e54040; }
      .form-msg--ok { color: #33c37d; }

      .badges-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
      .badge { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
        background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 6px; }
      .badge--locked { opacity: 0.35; filter: grayscale(1); }
      .badge-icon { font-size: 24px; }
      .badge-name { font-size: 10px; font-weight: 700; color: var(--text-primary); }

      .report-table { width: 100%; border-collapse: collapse; }
      .report-table th { text-align: left; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); padding: 6px 8px; border-bottom: 1px solid var(--border-color); }
      .report-table td { padding: 8px; font-size: 0.88rem; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); }
      .report-table tr:last-child td { border-bottom: none; }

      @media (max-width: 500px) {
        .content { padding: 1.75rem 1rem 4rem; }
        .site-header { padding: 0.9rem 1.25rem; }
        .site-header__back { margin-right: 2rem; }
      }
    </style>
    <script type="module">
      import '@shared/theme.css';
    </script>
  </head>
  <body>
    <header class="site-header">
      <a href="__VITE_BASE_PATH__" class="site-header__brand">dars-islam</a>
      <div id="langPicker" style="margin:0 8px"></div>
      <a href="__VITE_BASE_PATH__" class="site-header__back" id="backLink">← Back to games</a>
    </header>

    <main class="content">
      <header>
        <h1 id="dashTitle">📊 My Dashboard</h1>
        <p id="dashSub">Your progress across every game — just for you.</p>
      </header>

      <section id="welcomeSection" class="card class-card" hidden></section>

      <section id="classSection" class="card class-card" hidden></section>

      <section id="familyCodeSection" class="card class-card" hidden></section>

      <section id="assignedSection" class="card class-card" hidden></section>

      <section id="announcementsSection" class="card class-card" hidden></section>

      <section class="card">
        <h2 id="levelStreakHeading">Level &amp; Streak</h2>
        <div class="level-row">
          <span class="level-big" id="levelText">⭐ Level 1</span>
          <span class="streak-big" id="streakText">🔥 0-day streak</span>
        </div>
        <div class="xp-bar"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
        <p class="sub" id="xpSub"></p>
      </section>

      <section class="card">
        <h2 id="badgesHeading">Badges</h2>
        <div class="badges-grid" id="badgesGrid"></div>
      </section>

      <section class="card">
        <h2 id="reportCardHeading">Report Card</h2>
        <p class="sub" id="reportCardSub" style="margin-top:0"></p>
        <table class="report-table">
          <thead><tr><th id="reportTableGame">Game</th><th id="reportTableRounds">Rounds</th><th id="reportTableGrade">Grade</th><th></th></tr></thead>
          <tbody id="reportBody"></tbody>
        </table>
      </section>
    </main>

    <script type="module">
      import { PlayerProgress, tierForRounds, isCertificateEligible } from '@shared/player-progress';
      import { BADGES } from '@shared/badges';
      import { GAME_CATALOG } from '@shared/game-catalog';
      import { SchoolApi } from '@shared/school-api';
      import { sync } from '@shared/sync';
      import { getSupabase } from '@shared/supabase-client';
      import { printCertificate } from '@shared/certificates';
      import { ArcadeStore } from '@shared/arcade-store';
      import { renderLanguagePickerDom } from '@shared/language-picker-dom';
      import { reportContent } from '@shared/report-api';
      import { t } from '../dashboard-i18n';
      import { getLang, setLang, detectDefaultLang } from '../systems/Locale';

      let myClassId = null;

      function applyStaticI18n() {
        const s = t();
        document.getElementById('backLink').textContent = s.backToGames;
        document.getElementById('dashTitle').textContent = s.dashboardTitle;
        document.getElementById('dashSub').textContent = s.dashboardSub;
        document.getElementById('levelStreakHeading').textContent = s.levelStreakHeading;
        document.getElementById('badgesHeading').textContent = s.badgesHeading;
        document.getElementById('reportCardHeading').textContent = s.reportCardHeading;
        document.getElementById('reportCardSub').textContent = s.reportCardSub;
        document.getElementById('reportTableGame').textContent = s.reportTableGame;
        document.getElementById('reportTableRounds').textContent = s.reportTableRounds;
        document.getElementById('reportTableGrade').textContent = s.reportTableGrade;
      }

      function renderLangPicker() {
        const container = document.getElementById('langPicker');
        if (!container) return;
        renderLanguagePickerDom(container, getLang(), (lang) => {
          setLang(lang);
          renderLangPicker();
          renderAll();
        });
      }

      async function renderAll() {
        applyStaticI18n();
        renderProgress();
        await renderClassSection();
        await renderFamilyCodeCard();
        await renderAssignedSection();
        await renderAnnouncementsSection();
      }

      function renderProgress() {
        const s = t();
        const state = PlayerProgress.getState();
        const pct = Math.round((state.xpIntoLevel / Math.max(1, state.xpForNextLevel)) * 100);
        document.getElementById('levelText').textContent = s.levelText(state.level);
        document.getElementById('streakText').textContent = s.streakText(state.dailyStreak);
        document.getElementById('xpFill').style.width = `${pct}%`;
        document.getElementById('xpSub').textContent =
          s.xpSub(state.xpIntoLevel, state.xpForNextLevel, state.level + 1, state.totalRounds);

        const owned = new Set(state.badges.map((b) => b.id));
        document.getElementById('badgesGrid').innerHTML = BADGES.map((b) => `
          <div class="badge ${owned.has(b.id) ? '' : 'badge--locked'}" title="${b.description}">
            <span class="badge-icon">${b.icon}</span>
            <span class="badge-name">${b.name}</span>
          </div>`).join('');

        document.getElementById('reportBody').innerHTML = GAME_CATALOG.map((g) => {
          const count = state.gameRoundCounts[g.id] ?? 0;
          const tier = tierForRounds(count);
          const certBtn = isCertificateEligible(count)
            ? `<button data-cert-game="${g.id}" data-cert-title="${escapeHtml(g.title)}" style="padding:3px 8px;font-size:0.72rem;">${s.certificateBtn}</button>` : '';
          return `<tr><td>${g.icon} ${g.title}</td><td>${count}</td><td>${tier.icon} ${tier.label}</td><td>${certBtn}</td></tr>`;
        }).join('');

        document.querySelectorAll('[data-cert-game]').forEach((btn) => {
          btn.addEventListener('click', () => {
            printCertificate({
              studentName: ArcadeStore.getPlayerName() || s.defaultStudentName,
              achievement: s.certificateAchievement(btn.dataset.certTitle),
            });
          });
        });
      }

      function escapeHtml(s) {
        return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      async function renderFamilyCodeCard() {
        const section = document.getElementById('familyCodeSection');
        if (!sync.isStudent) { section.hidden = true; return; }
        try {
          const supabase = getSupabase();
          const { data, error } = await supabase.from('students').select('family_code, class_id').eq('user_id', sync.userId).single();
          if (error || !data) { section.hidden = true; return; }
          myClassId = data.class_id;
          if (!data.family_code) { section.hidden = true; return; }
          section.hidden = false;
          section.innerHTML = `
            <h2>${t().familyCodeHeading}</h2>
            <p class="sub">${t().familyCodeSub}</p>
            <p><span class="code-chip" style="font-family:'Courier New',monospace;font-weight:800;letter-spacing:0.1em;background:var(--bg-primary);border:1px dashed var(--border-color);border-radius:8px;padding:4px 10px;">${escapeHtml(data.family_code)}</span></p>`;
        } catch { section.hidden = true; }
      }

      function renderWelcomeSection(standing) {
        const section = document.getElementById('welcomeSection');
        const dismissKey = `dars-islam:welcome-dismissed:${standing.school_name}`;
        if (!standing.welcome_message || localStorage.getItem(dismissKey)) { section.hidden = true; return; }
        const orgIcon = { mosque: '🕌', homeschool: '🏡', other: '📚' }[standing.org_type] ?? '🏫';
        section.hidden = false;
        section.innerHTML = `
          <div class="row" style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <p style="margin:0;font-size:0.92rem;">${orgIcon} ${escapeHtml(standing.welcome_message)}</p>
            <button id="dismissWelcome" style="padding:4px 10px;font-size:0.75rem;flex-shrink:0;">${t().gotIt}</button>
          </div>`;
        document.getElementById('dismissWelcome').addEventListener('click', () => {
          localStorage.setItem(dismissKey, '1');
          section.hidden = true;
        });
      }

      async function renderAssignedSection() {
        const section = document.getElementById('assignedSection');
        if (!myClassId) { section.hidden = true; return; }
        try {
          const assignments = await SchoolApi.listAssignedGames(myClassId);
          if (!assignments.length) { section.hidden = true; return; }
          const todayStr = new Date().toISOString().slice(0, 10);
          section.hidden = false;
          section.innerHTML = `
            <h2>${t().assignedHeading}</h2>
            ${assignments.map((a) => {
              const g = GAME_CATALOG.find((x) => x.id === a.game_id);
              if (!g) return '';
              const overdue = a.due_date && a.due_date < todayStr;
              const dueLabel = a.due_date ? `<span class="sub" style="color:${overdue ? '#e54040' : 'inherit'}">${overdue ? t().wasDueLabel(a.due_date) : t().dueLabel(a.due_date)}</span>` : '';
              return `<p><a href="__VITE_BASE_PATH__games/${g.id}/">${g.icon} ${escapeHtml(g.title)}</a> ${dueLabel}</p>`;
            }).join('')}
            <p class="sub">${t().assignedNote}</p>`;
        } catch { section.hidden = true; }
      }

      async function renderAnnouncementsSection() {
        const section = document.getElementById('announcementsSection');
        if (!myClassId) { section.hidden = true; return; }
        try {
          const items = await SchoolApi.listAnnouncements(myClassId);
          if (!items.length) { section.hidden = true; return; }
          section.hidden = false;
          section.innerHTML = `
            <h2>${t().announcementsHeading}</h2>
            ${items.map((a) => `<p style="margin:0 0 8px">
              <strong>${new Date(a.created_at).toLocaleDateString()}:</strong> ${escapeHtml(a.message)}
              <a href="#" class="report-announcement-link" data-report-id="${a.id}" style="font-size:0.72rem;opacity:0.6;margin-left:6px;white-space:nowrap;">🚩 ${t().reportLink}</a>
            </p>`).join('')}`;
          section.querySelectorAll('.report-announcement-link').forEach((link) => {
            link.addEventListener('click', async (e) => {
              e.preventDefault();
              const reason = window.prompt(t().reportPromptLabel);
              if (!reason || !reason.trim()) return;
              try {
                await reportContent('announcement', link.dataset.reportId, reason.trim());
                window.alert(t().reportSentAlert);
              } catch {
                window.alert(t().reportFailedAlert);
              }
            });
          });
        } catch { section.hidden = true; }
      }

      async function renderClassSection() {
        const section = document.getElementById('classSection');
        try {
          const standing = await sync.isLoggedIn ? await SchoolApi.myClass() : { in_class: false };
          if (standing.in_class) {
            section.hidden = false;
            section.innerHTML = `
              <h2>${t().myClassHeading}</h2>
              <p><strong>${escapeHtml(standing.class_name)}</strong> · ${escapeHtml(standing.school_name)}</p>
              <p>${t().rankOf(standing.rank, standing.class_size, standing.my_xp, standing.avg_xp)}</p>`;
            renderWelcomeSection(standing);
            return;
          }
        } catch { /* not signed in or no membership — fall through to the join form */ }

        section.hidden = false;
        section.innerHTML = `
          <h2>${t().joinClassHeading}</h2>
          <p class="sub">${t().joinClassSub}</p>
          <form class="join-form" id="joinForm">
            <div class="join-form-row">
              <input id="joinCode" type="text" maxlength="6" placeholder="${t().classCodePlaceholder}" autocomplete="off" style="text-transform:uppercase" />
              <input id="joinName" type="text" maxlength="24" placeholder="${t().yourNamePlaceholder}" autocomplete="off" />
              <button type="submit">${t().joinBtn}</button>
            </div>
            <p class="form-msg" id="joinMsg"></p>
            <p class="join-note">${t().joinNote}</p>
          </form>`;

        document.getElementById('joinForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const code = document.getElementById('joinCode').value.trim();
          const name = document.getElementById('joinName').value.trim();
          const msg = document.getElementById('joinMsg');
          if (!code || !name) { msg.className = 'form-msg form-msg--error'; msg.textContent = t().joinErrorBoth; return; }
          msg.className = 'form-msg'; msg.textContent = t().joining;
          try {
            const result = await SchoolApi.joinClass(code, name);
            msg.className = 'form-msg form-msg--ok';
            msg.textContent = t().joinedReloading(result.class_name);
            setTimeout(() => window.location.reload(), 900);
          } catch (err) {
            msg.className = 'form-msg form-msg--error';
            msg.textContent = String(err?.message ?? '').includes('Too many attempts') ? t().tooManyAttempts : t().joinError;
          }
        });
      }

      renderLangPicker();
      applyStaticI18n();
      void detectDefaultLang().then(() => { renderLangPicker(); renderAll(); });

      (async () => {
        try { await sync.init(); } catch { /* guest is fine here */ }
        await renderAll();
      })();
    </script>
  </body>
</html>

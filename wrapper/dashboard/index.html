<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0f0a" />
    <title>My Dashboard · darsislam.Games</title>
    <link rel="icon" type="image/png" href="/games/board-rush/assets/icons/icon-512.png" />
    <style>
      body { display: flex; flex-direction: column; align-items: center; }

      .site-header {
        width: 100%;
        border-bottom: 1px solid var(--border-color);
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        box-sizing: border-box;
      }
      .site-header__brand {
        font-size: 0.9rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: linear-gradient(135deg, #ff0055, #ff6b35);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-decoration: none;
      }
      .site-header__back {
        font-size: 0.85rem;
        color: var(--text-secondary);
        text-decoration: none;
        margin-right: 3.5rem;
      }
      .site-header__back:hover { color: #ff0055; }

      .content {
        width: 100%;
        max-width: 760px;
        padding: 2.5rem 1.5rem 5rem;
        display: flex;
        flex-direction: column;
        gap: 1.75rem;
        box-sizing: border-box;
      }

      .content > header h1 { font-size: 1.9rem; font-weight: 900; color: var(--text-primary); margin-bottom: 0.3rem; }
      .content > header p { font-size: 0.88rem; color: var(--text-muted); }

      .card {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 1.25rem 1.4rem;
      }

      .card h2 {
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #ff0055;
        margin-bottom: 0.9rem;
      }

      .level-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .level-big { font-size: 1.4rem; font-weight: 900; color: #ffb020; }
      .streak-big { font-size: 1rem; font-weight: 700; color: #ff8a3d; }
      .xp-bar { width: 100%; height: 12px; background: var(--border-color); border-radius: 6px; overflow: hidden; margin-top: 12px; }
      .xp-fill { height: 100%; background: linear-gradient(90deg, #ffb347, #ffd700); border-radius: 6px; }
      .sub { font-size: 0.82rem; color: var(--text-muted); margin-top: 6px; }

      .class-card p { font-size: 0.92rem; color: var(--text-secondary); margin: 0.2rem 0; }
      .class-card strong { color: var(--text-primary); }

      .join-form { display: flex; flex-direction: column; gap: 8px; }
      .join-form-row { display: flex; gap: 8px; flex-wrap: wrap; }
      .join-form input {
        flex: 1; min-width: 140px; background: var(--bg-primary); color: var(--text-primary);
        border: 1px solid var(--border-color); border-radius: 8px; padding: 9px 12px; font-size: 0.9rem; box-sizing: border-box;
      }
      .join-form button, .card button {
        background: var(--accent); color: #fff; border: none; border-radius: 8px;
        padding: 9px 16px; font-size: 0.88rem; font-weight: 700; cursor: pointer;
      }
      .join-form button:hover, .card button:hover { filter: brightness(1.1); }
      .join-note { font-size: 0.76rem; color: var(--text-muted); }
      .form-msg { font-size: 0.82rem; min-height: 1.2em; }
      .form-msg--error { color: #e54040; }
      .form-msg--ok { color: #33c37d; }

      .badges-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
      .badge { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
        background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 6px; }
      .badge--locked { opacity: 0.35; filter: grayscale(1); }
      .badge-icon { font-size: 24px; }
      .badge-name { font-size: 10px; font-weight: 700; color: var(--text-primary); }

      .report-table { width: 100%; border-collapse: collapse; }
      .report-table th { text-align: left; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); padding: 6px 8px; border-bottom: 1px solid var(--border-color); }
      .report-table td { padding: 8px; font-size: 0.88rem; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); }
      .report-table tr:last-child td { border-bottom: none; }

      @media (max-width: 500px) {
        .content { padding: 1.75rem 1rem 4rem; }
        .site-header { padding: 0.9rem 1.25rem; }
        .site-header__back { margin-right: 2rem; }
      }
    </style>
    <script type="module">
      import '@shared/theme.css';
    </script>
  </head>
  <body>
    <header class="site-header">
      <a href="/" class="site-header__brand">darsislam.Games</a>
      <a href="/" class="site-header__back">← Back to games</a>
    </header>

    <main class="content">
      <header>
        <h1>📊 My Dashboard</h1>
        <p>Your progress across every game — just for you.</p>
      </header>

      <section id="classSection" class="card class-card" hidden></section>

      <section class="card">
        <h2>Level &amp; Streak</h2>
        <div class="level-row">
          <span class="level-big" id="levelText">⭐ Level 1</span>
          <span class="streak-big" id="streakText">🔥 0-day streak</span>
        </div>
        <div class="xp-bar"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
        <p class="sub" id="xpSub"></p>
      </section>

      <section class="card">
        <h2>Badges</h2>
        <div class="badges-grid" id="badgesGrid"></div>
      </section>

      <section class="card">
        <h2>Report Card</h2>
        <table class="report-table">
          <thead><tr><th>Game</th><th>Rounds</th><th>Grade</th></tr></thead>
          <tbody id="reportBody"></tbody>
        </table>
      </section>
    </main>

    <script type="module">
      import { PlayerProgress, tierForRounds } from '@shared/player-progress';
      import { BADGES } from '@shared/badges';
      import { GAME_CATALOG } from '@shared/game-catalog';
      import { SchoolApi } from '@shared/school-api';
      import { sync } from '@shared/sync';

      function renderProgress() {
        const state = PlayerProgress.getState();
        const pct = Math.round((state.xpIntoLevel / Math.max(1, state.xpForNextLevel)) * 100);
        document.getElementById('levelText').textContent = `⭐ Level ${state.level}`;
        document.getElementById('streakText').textContent = `🔥 ${state.dailyStreak}-day streak`;
        document.getElementById('xpFill').style.width = `${pct}%`;
        document.getElementById('xpSub').textContent =
          `${state.xpIntoLevel} / ${state.xpForNextLevel} XP to level ${state.level + 1} · ${state.totalRounds} rounds played total`;

        const owned = new Set(state.badges.map((b) => b.id));
        document.getElementById('badgesGrid').innerHTML = BADGES.map((b) => `
          <div class="badge ${owned.has(b.id) ? '' : 'badge--locked'}" title="${b.description}">
            <span class="badge-icon">${b.icon}</span>
            <span class="badge-name">${b.name}</span>
          </div>`).join('');

        document.getElementById('reportBody').innerHTML = GAME_CATALOG.map((g) => {
          const count = state.gameRoundCounts[g.id] ?? 0;
          const tier = tierForRounds(count);
          return `<tr><td>${g.icon} ${g.title}</td><td>${count}</td><td>${tier.icon} ${tier.label}</td></tr>`;
        }).join('');
      }

      function escapeHtml(s) {
        return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      async function renderClassSection() {
        const section = document.getElementById('classSection');
        try {
          const standing = await sync.isLoggedIn ? await SchoolApi.myClass() : { in_class: false };
          if (standing.in_class) {
            section.hidden = false;
            section.innerHTML = `
              <h2>My Class</h2>
              <p><strong>${escapeHtml(standing.class_name)}</strong> · ${escapeHtml(standing.school_name)}</p>
              <p>Rank <strong>#${standing.rank}</strong> of ${standing.class_size} · ${standing.my_xp} XP (class average ${standing.avg_xp} XP)</p>`;
            return;
          }
        } catch { /* not signed in or no membership — fall through to the join form */ }

        section.hidden = false;
        section.innerHTML = `
          <h2>Join a Class</h2>
          <p class="sub">Got a code from your teacher? Enter it here to join their class and appear on their roster.</p>
          <form class="join-form" id="joinForm">
            <div class="join-form-row">
              <input id="joinCode" type="text" maxlength="6" placeholder="Class code (e.g. AB12CD)" autocomplete="off" style="text-transform:uppercase" />
              <input id="joinName" type="text" maxlength="24" placeholder="Your name" autocomplete="off" />
              <button type="submit">Join</button>
            </div>
            <p class="form-msg" id="joinMsg"></p>
            <p class="join-note">Joining signs you in as a student on this device — if someone else is already signed in here, joining will switch to the new student profile.</p>
          </form>`;

        document.getElementById('joinForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const code = document.getElementById('joinCode').value.trim();
          const name = document.getElementById('joinName').value.trim();
          const msg = document.getElementById('joinMsg');
          if (!code || !name) { msg.className = 'form-msg form-msg--error'; msg.textContent = 'Enter both a class code and your name.'; return; }
          msg.className = 'form-msg'; msg.textContent = 'Joining…';
          try {
            const result = await SchoolApi.joinClass(code, name);
            const { setSessionToken } = await import('@shared/api');
            setSessionToken(result.session_token);
            msg.className = 'form-msg form-msg--ok';
            msg.textContent = `Joined ${result.class_name}! Reloading…`;
            setTimeout(() => window.location.reload(), 900);
          } catch {
            msg.className = 'form-msg form-msg--error';
            msg.textContent = 'Could not join — check the code and try again.';
          }
        });
      }

      (async () => {
        try { await sync.init(); } catch { /* guest is fine here */ }
        renderProgress();
        await renderClassSection();
      })();
    </script>
  </body>
</html>

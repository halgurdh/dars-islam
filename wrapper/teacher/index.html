<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0f0a" />
    <title>Teacher Dashboard · darsislam.Games</title>
    <link rel="icon" type="image/png" href="__VITE_BASE_PATH__games/board-rush/assets/icons/icon-512.png" />
    <style>
      body { display: flex; flex-direction: column; align-items: center; }

      .site-header {
        width: 100%;
        border-bottom: 1px solid var(--border-color);
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        box-sizing: border-box;
      }
      .site-header__brand {
        font-size: 0.9rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: linear-gradient(135deg, #ff0055, #ff6b35);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-decoration: none;
      }
      .site-header__back {
        font-size: 0.85rem;
        color: var(--text-secondary);
        text-decoration: none;
        margin-right: 3.5rem;
      }
      .site-header__back:hover { color: #ff0055; }

      .content {
        width: 100%;
        max-width: 900px;
        padding: 2.5rem 1.5rem 5rem;
        display: flex;
        flex-direction: column;
        gap: 1.75rem;
        box-sizing: border-box;
      }

      .content > header h1 { font-size: 1.9rem; font-weight: 900; color: var(--text-primary); margin-bottom: 0.3rem; }
      .content > header p { font-size: 0.88rem; color: var(--text-muted); }

      .card {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 1.25rem 1.4rem;
      }
      .card h2 {
        font-size: 0.72rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
        color: #ff0055; margin-bottom: 0.9rem;
      }
      .card + .card { margin-top: 0; }

      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      .row input, .row select {
        background: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border-color);
        border-radius: 8px; padding: 9px 12px; font-size: 0.9rem; box-sizing: border-box;
      }
      .row input { flex: 1; min-width: 160px; }
      button {
        background: var(--accent); color: #fff; border: none; border-radius: 8px;
        padding: 9px 16px; font-size: 0.88rem; font-weight: 700; cursor: pointer;
      }
      button:hover { filter: brightness(1.1); }
      button.ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-color); }
      .sub { font-size: 0.82rem; color: var(--text-muted); }
      .form-msg { font-size: 0.82rem; min-height: 1.2em; }
      .form-msg--error { color: #e54040; }
      .form-msg--ok { color: #33c37d; }

      .code-chip {
        display: inline-block; font-family: 'Courier New', monospace; font-weight: 800; letter-spacing: 0.1em;
        background: var(--bg-primary); border: 1px dashed var(--border-color); border-radius: 8px; padding: 4px 10px;
      }

      .class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 12px; }
      .class-tile {
        background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 10px;
        padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; text-decoration: none;
      }
      .class-tile:hover { border-color: var(--accent); }
      .class-tile strong { color: var(--text-primary); font-size: 0.95rem; }
      .class-tile span { font-size: 0.78rem; color: var(--text-muted); }

      table { width: 100%; border-collapse: collapse; margin-top: 8px; }
      th { text-align: left; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); padding: 6px 8px; border-bottom: 1px solid var(--border-color); }
      td { padding: 8px; font-size: 0.88rem; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); }
      tr:last-child td { border-bottom: none; }
      tr.top-row td:first-child { color: #ffd700; font-weight: 800; }
      tr.bottom-row td:first-child { color: #ff8a3d; font-weight: 800; }

      .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      @media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }

      @media (max-width: 500px) {
        .content { padding: 1.75rem 1rem 4rem; }
        .site-header { padding: 0.9rem 1.25rem; }
        .site-header__back { margin-right: 2rem; }
      }
    </style>
    <script type="module">
      import '@shared/theme.css';
    </script>
  </head>
  <body>
    <header class="site-header">
      <a href="__VITE_BASE_PATH__" class="site-header__brand">darsislam.Games</a>
      <a href="__VITE_BASE_PATH__" class="site-header__back">← Back to games</a>
    </header>

    <main class="content">
      <header>
        <h1>🏫 Teacher Dashboard</h1>
        <p>Schools, classes and student progress at a glance.</p>
      </header>

      <div id="app"></div>
    </main>

    <script type="module">
      import { sync } from '@shared/sync';
      import { SchoolApi } from '@shared/school-api';
      import { ProgressBar } from '@shared/progress-bar';
      import { GAME_CATALOG } from '@shared/game-catalog';
      import { summarizeReportCard } from '@shared/report-card';
      import { printClassCertificates } from '@shared/certificates';

      const ORG_TYPE_LABELS = { school: '🏫 School', mosque: '🕌 Mosque', homeschool: '🏡 Homeschool', other: '📚 Other' };

      function daysSince(dateStr) {
        if (!dateStr) return Infinity;
        return Math.floor((Date.now() - new Date(dateStr + 'T00:00:00').getTime()) / 86400000);
      }

      function downloadCsv(filename, rows) {
        const csv = rows.map((row) => row.map((cell) => `"${String(cell ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
      }

      const progressBar = new ProgressBar();
      const app = document.getElementById('app');

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      function setParams(next) {
        const params = new URLSearchParams(window.location.search);
        Object.entries(next).forEach(([k, v]) => (v === null ? params.delete(k) : params.set(k, v)));
        window.history.pushState({}, '', `${window.location.pathname}?${params.toString()}`);
        render();
      }

      function renderSignedOut() {
        app.innerHTML = `
          <div class="card">
            <h2>Sign In Required</h2>
            <p class="sub">Sign in with the same email you use for darsislam.Games to create or manage a school.</p>
            <button id="teacherSignIn" style="margin-top:10px">☁ Sign in</button>
          </div>`;
        document.getElementById('teacherSignIn').addEventListener('click', () => progressBar.openSignIn());
      }

      function renderNoSchool() {
        app.innerHTML = `
          <div class="two-col">
            <div class="card">
              <h2>Create a School</h2>
              <p class="sub">You'll get an invite code to share with other teachers.</p>
              <form id="createSchoolForm" class="row" style="margin-top:10px">
                <input id="schoolName" type="text" maxlength="120" placeholder="School name" />
                <button type="submit">Create</button>
              </form>
              <p class="form-msg" id="createSchoolMsg"></p>
            </div>
            <div class="card">
              <h2>Join a School</h2>
              <p class="sub">Have an invite code from a colleague?</p>
              <form id="joinSchoolForm" class="row" style="margin-top:10px">
                <input id="schoolCode" type="text" maxlength="8" placeholder="Invite code" style="text-transform:uppercase" />
                <button type="submit">Join</button>
              </form>
              <p class="form-msg" id="joinSchoolMsg"></p>
            </div>
          </div>`;

        document.getElementById('createSchoolForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const name = document.getElementById('schoolName').value.trim();
          const msg = document.getElementById('createSchoolMsg');
          if (!name) return;
          msg.className = 'form-msg'; msg.textContent = 'Creating…';
          try {
            const school = await SchoolApi.createSchool(name);
            setParams({ school: school.id, class: null });
          } catch {
            msg.className = 'form-msg form-msg--error'; msg.textContent = 'Could not create the school.';
          }
        });

        document.getElementById('joinSchoolForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const code = document.getElementById('schoolCode').value.trim();
          const msg = document.getElementById('joinSchoolMsg');
          if (!code) return;
          msg.className = 'form-msg'; msg.textContent = 'Joining…';
          try {
            const school = await SchoolApi.joinSchool(code);
            setParams({ school: school.id, class: null });
          } catch {
            msg.className = 'form-msg form-msg--error'; msg.textContent = 'Invite code not found.';
          }
        });
      }

      function schoolSwitcher(schools, current) {
        if (schools.length < 2) return '';
        const opts = schools.map((s) => `<option value="${s.id}" ${s.id === current.id ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('');
        return `<select id="schoolSwitch">${opts}</select>`;
      }

      async function renderSchoolOverview(schools, school) {
        app.innerHTML = `
          <div class="card">
            <div class="row" style="justify-content:space-between">
              <h2 style="margin:0">${escapeHtml(school.name)}</h2>
              ${schoolSwitcher(schools, school)}
            </div>
            <p class="sub">Invite other teachers with code <span class="code-chip">${school.invite_code}</span></p>
            <form id="createClassForm" class="row" style="margin-top:14px">
              <input id="className" type="text" maxlength="80" placeholder="New class name (e.g. Grade 4B)" />
              <button type="submit">Create Class</button>
            </form>
            <p class="form-msg" id="createClassMsg"></p>
            <div class="class-grid" id="classGrid"></div>
          </div>
          <div class="card" id="orgSettingsCard"><p class="sub">Loading settings…</p></div>
          <div class="two-col" id="schoolStats"></div>`;

        document.getElementById('schoolSwitch')?.addEventListener('change', (e) => setParams({ school: e.target.value, class: null }));

        SchoolApi.getSchoolProfile(school.id).then((profile) => {
          const options = Object.entries(ORG_TYPE_LABELS)
            .map(([v, label]) => `<option value="${v}" ${profile.org_type === v ? 'selected' : ''}>${label}</option>`).join('');
          document.getElementById('orgSettingsCard').innerHTML = `
            <h2>⚙️ Organization Settings</h2>
            <p class="sub">Label your organization and greet students who join — a mosque, homeschool co-op, or club works exactly like a school here.</p>
            <div class="row" style="margin-top:10px">
              <select id="orgType">${options}</select>
            </div>
            <textarea id="welcomeMessage" maxlength="300" placeholder="Optional welcome message shown to students when they join (e.g. 'Welcome to Al-Noor Mosque weekend classes!')"
              style="width:100%;box-sizing:border-box;margin-top:10px;min-height:64px;background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border-color);border-radius:8px;padding:9px 12px;font-size:0.88rem;font-family:inherit;">${escapeHtml(profile.welcome_message ?? '')}</textarea>
            <button id="saveOrgSettings" style="margin-top:10px">Save</button>
            <p class="form-msg" id="orgSettingsMsg"></p>`;
          document.getElementById('saveOrgSettings').addEventListener('click', async () => {
            const msg = document.getElementById('orgSettingsMsg');
            msg.className = 'form-msg'; msg.textContent = 'Saving…';
            try {
              await SchoolApi.updateSchoolProfile(school.id, document.getElementById('orgType').value, document.getElementById('welcomeMessage').value);
              msg.className = 'form-msg form-msg--ok'; msg.textContent = 'Saved.';
            } catch {
              msg.className = 'form-msg form-msg--error'; msg.textContent = 'Could not save — try again.';
            }
          });
        }).catch(() => { document.getElementById('orgSettingsCard').innerHTML = ''; });

        document.getElementById('classGrid').innerHTML = school.classes.length
          ? school.classes.map((c) => `
              <a class="class-tile" href="?school=${school.id}&class=${c.id}" data-class="${c.id}">
                <strong>${escapeHtml(c.name)}</strong>
                <span>Code <span class="code-chip">${c.join_code}</span></span>
                <span>${c.student_count} student${c.student_count === 1 ? '' : 's'} · avg ${c.avg_xp} XP</span>
              </a>`).join('')
          : '<p class="sub">No classes yet — create one above.</p>';

        app.querySelectorAll('.class-tile').forEach((el) => el.addEventListener('click', (e) => {
          e.preventDefault();
          setParams({ school: school.id, class: el.dataset.class });
        }));

        document.getElementById('createClassForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const name = document.getElementById('className').value.trim();
          const msg = document.getElementById('createClassMsg');
          if (!name) return;
          msg.className = 'form-msg'; msg.textContent = 'Creating…';
          try {
            await SchoolApi.createClass(school.id, name);
            render();
          } catch {
            msg.className = 'form-msg form-msg--error'; msg.textContent = 'Could not create the class.';
          }
        });

        try {
          const dash = await SchoolApi.schoolDashboard(school.id);
          const rankedRows = (list, cls) => list.length
            ? list.map((s, i) => `<tr class="${cls}"><td>#${i + 1}</td><td>${escapeHtml(s.display_name)}</td><td>${escapeHtml(s.class_name ?? '')}</td><td>${s.xp} XP</td></tr>`).join('')
            : '<tr><td colspan="4" class="sub">No students yet</td></tr>';

          document.getElementById('schoolStats').innerHTML = `
            <div class="card">
              <h2>🏆 Top Students (School-Wide)</h2>
              <table><thead><tr><th>#</th><th>Name</th><th>Class</th><th>XP</th></tr></thead>
                <tbody>${rankedRows(dash.top_students, 'top-row')}</tbody></table>
            </div>
            <div class="card">
              <h2>🌱 Could Use a Nudge</h2>
              <table><thead><tr><th>#</th><th>Name</th><th>Class</th><th>XP</th></tr></thead>
                <tbody>${rankedRows(dash.bottom_students, 'bottom-row')}</tbody></table>
            </div>`;
        } catch { /* dashboard stats are a nice-to-have — overview still works without them */ }
      }

      async function renderAssignGamesCard(classId) {
        const assignments = await SchoolApi.listAssignedGames(classId).catch(() => []);
        const dueById = Object.fromEntries(assignments.map((a) => [a.game_id, a.due_date]));
        const assigned = new Set(assignments.map((a) => a.game_id));
        const assignedList = GAME_CATALOG.filter((g) => assigned.has(g.id));
        const unassigned = GAME_CATALOG.filter((g) => !assigned.has(g.id));

        const assignedHtml = assignedList.length
          ? assignedList.map((g) => `
              <div class="code-chip" data-game-id="${g.id}" style="margin:0 6px 6px 0;display:inline-flex;align-items:center;gap:6px;">
                <span>${g.icon} ${escapeHtml(g.title)}</span>
                <input type="date" class="due-date-input" value="${dueById[g.id] ?? ''}" title="Due date (optional — a reminder, not a penalty)" style="font-size:11px;padding:2px 4px;" />
              </div>`).join('')
          : '<p class="sub">No games assigned yet.</p>';

        const optionsHtml = unassigned.map((g) => `
          <label style="display:flex;align-items:center;gap:6px;font-size:0.85rem;color:var(--text-secondary);">
            <input type="checkbox" value="${g.id}" /> ${g.icon} ${escapeHtml(g.title)}
          </label>`).join('');

        return `
          <div class="card">
            <h2>📌 Assigned Games</h2>
            <div>${assignedHtml}</div>
            ${assignedList.length ? '<p class="sub" style="margin-top:4px">Optional due date shown as a reminder chip to students — nothing is locked or penalized.</p>' : ''}
            ${unassigned.length ? `
              <p class="sub" style="margin-top:14px">Assign more:</p>
              <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;max-height:220px;overflow-y:auto;margin-top:6px;">
                ${optionsHtml}
              </div>
              <button id="assignGamesBtn" style="margin-top:12px">Assign Selected</button>
              <p class="form-msg" id="assignGamesMsg"></p>
            ` : '<p class="sub" style="margin-top:10px">All games are assigned.</p>'}
          </div>`;
      }

      function bindAssignGamesCard(classId) {
        document.querySelectorAll('.code-chip[data-game-id] .due-date-input').forEach((input) => {
          input.addEventListener('change', async () => {
            const gameId = input.closest('[data-game-id]').getAttribute('data-game-id');
            try { await SchoolApi.setAssignmentDueDate(classId, gameId, input.value || null); }
            catch { /* not critical — teacher can retry */ }
          });
        });
        document.getElementById('assignGamesBtn')?.addEventListener('click', async () => {
          const msg = document.getElementById('assignGamesMsg');
          const ids = [...document.querySelectorAll('#app input[type=checkbox]:checked')].map((el) => el.value);
          if (ids.length === 0) return;
          msg.className = 'form-msg'; msg.textContent = 'Assigning…';
          try {
            await Promise.all(ids.map((id) => SchoolApi.assignGame(classId, id)));
            render();
          } catch {
            msg.className = 'form-msg form-msg--error';
            msg.textContent = 'Could not assign — try again.';
          }
        });
      }

      function renderAnnouncementsCard(items) {
        const list = items.length
          ? items.map((a) => `
              <div class="row" style="justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border-color);">
                <div><p style="margin:0;font-size:0.88rem;">${escapeHtml(a.message)}</p><p class="sub" style="margin:2px 0 0">${new Date(a.created_at).toLocaleDateString()}</p></div>
                <button class="ghost" data-delete-announcement="${a.id}" style="padding:4px 8px;font-size:0.75rem;">✕</button>
              </div>`).join('')
          : '<p class="sub">No announcements yet.</p>';
        return `
          <div class="card">
            <h2>📣 Class Announcements</h2>
            <div>${list}</div>
            <form id="postAnnouncementForm" class="row" style="margin-top:12px">
              <input id="announcementText" type="text" maxlength="500" placeholder="Homework, reminders, anything for the class…" />
              <button type="submit">Post</button>
            </form>
            <p class="form-msg" id="announcementMsg"></p>
          </div>`;
      }

      function bindAnnouncementsCard(classId) {
        document.getElementById('postAnnouncementForm')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const input = document.getElementById('announcementText');
          const msg = document.getElementById('announcementMsg');
          if (!input.value.trim()) return;
          msg.className = 'form-msg'; msg.textContent = 'Posting…';
          try {
            await SchoolApi.postAnnouncement(classId, input.value);
            input.value = '';
            renderClassRosterById(classId);
          } catch {
            msg.className = 'form-msg form-msg--error'; msg.textContent = 'Could not post — try again.';
          }
        });
        document.querySelectorAll('[data-delete-announcement]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            try { await SchoolApi.deleteAnnouncement(btn.dataset.deleteAnnouncement); renderClassRosterById(classId); } catch { /* ignore */ }
          });
        });
      }

      async function renderAttendanceCard(classId, roster) {
        const today = new Date().toISOString().slice(0, 10);
        const present = await SchoolApi.classAttendance(classId, today).catch(() => ({}));
        const rows = roster.students.map((s) => `
          <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;padding:4px 0;">
            <input type="checkbox" value="${s.student_id}" ${present[s.student_id] !== false ? 'checked' : ''} />
            ${escapeHtml(s.display_name)}
          </label>`).join('') || '<p class="sub">No students yet.</p>';
        return `
          <div class="card">
            <h2>🗓️ Attendance — Today</h2>
            <p class="sub">Check who's present for today's session. Unchecked = absent for this date only.</p>
            <div style="margin-top:8px">${rows}</div>
            ${roster.students.length ? '<button id="saveAttendanceBtn" style="margin-top:10px">Save Attendance</button><p class="form-msg" id="attendanceMsg"></p>' : ''}
          </div>`;
      }

      function bindAttendanceCard(classId) {
        document.getElementById('saveAttendanceBtn')?.addEventListener('click', async (e) => {
          const card = e.target.closest('.card');
          const ids = [...card.querySelectorAll('input[type=checkbox]:checked')].map((el) => el.value);
          const msg = document.getElementById('attendanceMsg');
          msg.className = 'form-msg'; msg.textContent = 'Saving…';
          try {
            await SchoolApi.markAttendance(classId, new Date().toISOString().slice(0, 10), ids);
            msg.className = 'form-msg form-msg--ok'; msg.textContent = 'Saved.';
          } catch {
            msg.className = 'form-msg form-msg--error'; msg.textContent = 'Could not save — try again.';
          }
        });
      }

      let currentSchool = null, currentSchools = null;

      async function renderClassRosterById(classId) {
        const classSummary = currentSchool.classes.find((c) => c.id === classId);
        if (classSummary) await renderClassRoster(currentSchools, currentSchool, classSummary);
      }

      async function renderClassRoster(schools, school, classSummary) {
        currentSchool = school; currentSchools = schools;
        app.innerHTML = `<div class="card"><p class="sub">Loading roster…</p></div>`;
        try {
          const roster = await SchoolApi.classRoster(classSummary.id);
          const rows = roster.students.map((s, i) => {
            const cls = i < 3 ? 'top-row' : (i >= roster.students.length - 3 && roster.students.length > 3 ? 'bottom-row' : '');
            const inactive = daysSince(s.last_played_date) >= 3;
            return `<tr class="${cls}">
              <td>#${i + 1}</td>
              <td>${inactive ? '<span title="Hasn\'t played in a few days — might be worth a friendly nudge">👋</span> ' : ''}${escapeHtml(s.display_name)}</td>
              <td>Lvl ${s.level}</td>
              <td>🔥 ${s.daily_streak}</td>
              <td>${s.badge_count} 🏅</td>
              <td>${s.xp} XP</td>
              <td style="white-space:nowrap;font-size:0.78rem;">${escapeHtml(summarizeReportCard(s.game_round_counts))}</td>
              <td>${s.attendance_pct === null ? '—' : s.attendance_pct + '%'}</td>
              <td><input type="text" class="teacher-note-input" data-student="${s.student_id}" value="${escapeHtml(s.teacher_note ?? '')}" maxlength="500" placeholder="Private note…" style="width:120px;font-size:0.78rem;background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border-color);border-radius:6px;padding:4px 6px;" /></td>
            </tr>`;
          }).join('') || '<tr><td colspan="9" class="sub">No students have joined yet.</td></tr>';

          app.innerHTML = `
            <div class="card">
              <button class="ghost" id="backToSchool">← Back to ${escapeHtml(school.name)}</button>
              <div class="row" style="justify-content:space-between; margin-top:12px">
                <h2 style="margin:0">${escapeHtml(roster.class.name)}</h2>
                <span class="sub">Share code <span class="code-chip">${roster.class.join_code}</span></span>
              </div>
              <p class="sub">${roster.students.length} students · class average ${roster.avg_xp} XP</p>
              <div style="overflow-x:auto">
                <table>
                  <thead><tr><th>#</th><th>Name</th><th>Level</th><th>Streak</th><th>Badges</th><th>XP</th><th>Report card</th><th>Attend.</th><th>Note</th></tr></thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
              <div class="row" style="margin-top:12px">
                <button class="ghost" id="exportCsvBtn">⬇ Export CSV</button>
                <button class="ghost" id="printReportBtn">🖨 Print Class Report</button>
                <button class="ghost" id="printCertsBtn">🏅 Print Term Certificates</button>
              </div>
            </div>
            <div id="announcementsHost"></div>
            <div id="attendanceHost"></div>
            <div id="assignGamesHost"></div>`;
          document.getElementById('backToSchool').addEventListener('click', () => setParams({ school: school.id, class: null }));

          document.querySelectorAll('.teacher-note-input').forEach((input) => {
            input.addEventListener('change', async () => {
              try { await SchoolApi.setTeacherNote(input.dataset.student, input.value); } catch { /* not critical — teacher can retry */ }
            });
          });

          document.getElementById('exportCsvBtn').addEventListener('click', () => {
            const header = ['#', 'Name', 'Level', 'Streak', 'Badges', 'XP', 'Report card', 'Attendance %'];
            const csvRows = [header, ...roster.students.map((s, i) => [
              i + 1, s.display_name, s.level, s.daily_streak, s.badge_count, s.xp,
              summarizeReportCard(s.game_round_counts), s.attendance_pct === null ? '' : s.attendance_pct,
            ])];
            downloadCsv(`${roster.class.name.replace(/[^a-z0-9]+/gi, '-')}-roster.csv`, csvRows);
          });
          document.getElementById('printReportBtn').addEventListener('click', () => {
            const win = window.open('', '_blank', 'width=900,height=700');
            if (!win) return;
            const body = `<h1>${escapeHtml(roster.class.name)}</h1><p>${roster.students.length} students · class average ${roster.avg_xp} XP · ${new Date().toLocaleDateString()}</p>
              <table border="1" cellpadding="6" style="border-collapse:collapse;width:100%;font-family:sans-serif">
                <tr><th>Name</th><th>Level</th><th>XP</th><th>Report card</th><th>Attendance</th></tr>
                ${roster.students.map((s) => `<tr><td>${escapeHtml(s.display_name)}</td><td>${s.level}</td><td>${s.xp}</td><td>${escapeHtml(summarizeReportCard(s.game_round_counts))}</td><td>${s.attendance_pct === null ? '—' : s.attendance_pct + '%'}</td></tr>`).join('')}
              </table>`;
            win.document.write(`<!doctype html><html><head><title>${escapeHtml(roster.class.name)} report</title></head><body>${body}</body></html>`);
            win.document.close(); win.focus();
            setTimeout(() => win.print(), 300);
          });
          document.getElementById('printCertsBtn').addEventListener('click', () => {
            printClassCertificates(roster.students, 'Successful Completion of Term', roster.class.name);
          });

          document.getElementById('announcementsHost').innerHTML = renderAnnouncementsCard(await SchoolApi.listAnnouncements(classSummary.id).catch(() => []));
          bindAnnouncementsCard(classSummary.id);

          document.getElementById('attendanceHost').innerHTML = await renderAttendanceCard(classSummary.id, roster);
          bindAttendanceCard(classSummary.id);

          document.getElementById('assignGamesHost').innerHTML = await renderAssignGamesCard(classSummary.id);
          bindAssignGamesCard(classSummary.id);
        } catch {
          app.innerHTML = `<div class="card"><p class="form-msg form-msg--error">Could not load this class's roster.</p></div>`;
        }
      }

      async function render() {
        if (!sync.isLoggedIn) { renderSignedOut(); return; }

        let schools;
        try {
          ({ schools } = await SchoolApi.listSchools());
        } catch {
          app.innerHTML = '<div class="card"><p class="form-msg form-msg--error">Could not load your schools.</p></div>';
          return;
        }
        if (schools.length === 0) { renderNoSchool(); return; }

        const params = new URLSearchParams(window.location.search);
        const school = schools.find((s) => s.id === params.get('school')) ?? schools[0];
        const classId = params.get('class');
        const classSummary = classId ? school.classes.find((c) => c.id === classId) : null;

        if (classSummary) await renderClassRoster(schools, school, classSummary);
        else await renderSchoolOverview(schools, school);
      }

      window.addEventListener('popstate', render);

      (async () => {
        try { await sync.init(); } catch { /* not signed in — render() handles that state */ }
        // A magic-link redirect lands here with ?mt_session=... already consumed by sync.init();
        // just re-render once auth state settles.
        render();
      })();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Months Builder" />
    <meta name="theme-color" content="#081417" />
    <meta name="description" content="Learn the 12 Islamic (Hijri) months by spelling each one." />
    <link rel="apple-touch-icon" href="assets/icons/icon-512.png" />
    <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
    <title>Months Builder</title>
    <script>
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', savedTheme || (prefersDark ? 'dark' : 'light'));
    </script>
    <style>
      html {
        width: 100%;
        height: 100%;
      }
      html, body {
        background: #081417;
        overflow: hidden;
        font-family: 'Segoe UI', system-ui, sans-serif;
        width: 100%;
        height: 100%;
        margin: 0;
      }
      #game {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <a href="/" class="game-exit">← Exit Game</a>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light mode">
      <svg class="theme-icon theme-icon--dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
      <svg class="theme-icon theme-icon--light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      </svg>
    </button>
    <button id="fullscreen-toggle" class="fullscreen-toggle" aria-label="Enter fullscreen" hidden>⛶</button>
    <button id="install-toggle" class="install-toggle" aria-label="Install app" hidden>📲 Install</button>
    <div id="game"></div>
    <script type="module" src="./src/main.ts"></script>
    <script type="module">
      import '@shared/theme.css';
      import { initTheme, initFullscreen, initInstallPrompt, initOrientationLock } from '@shared/theme.js';
      initTheme();
      initFullscreen({ targetId: 'game' });
      initInstallPrompt();
      initOrientationLock('portrait');
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Civics & Community" />
    <meta name="theme-color" content="#0f1a14" />
    <meta name="description" content="Community helpers, rules, rights and government." />
    <link rel="apple-touch-icon" href="assets/icons/icon-512.png" />
    <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
    <title>Civics & Community</title>
    <style>
      html {
        width: 100%;
        height: 100%;
      }
      html, body {
        background: #0f1a14;
        overflow: hidden;
        font-family: 'Segoe UI', system-ui, sans-serif;
        width: 100%;
        height: 100%;
        margin: 0;
      }
      #game {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <a href="__VITE_BASE_PATH__" class="game-exit">← Exit Game</a>
    <button id="fullscreen-toggle" class="fullscreen-toggle" aria-label="Enter fullscreen" hidden>⛶</button>
    <div id="game"></div>
    <script type="module" src="./src/main.ts"></script>
    <script type="module">
      import '@shared/theme.css';
      import { initFullscreen, initOrientationLock } from '@shared/theme.js';
      initFullscreen({ targetId: 'game' });
      initOrientationLock('portrait');
    </script>
  </body>
</html>

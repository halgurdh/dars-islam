<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0f0a" />
    <title>Privacy Policy · dars-islam</title>
    <link rel="icon" type="image/png" href="/dars-islam/games/asma-match/assets/icons/icon-512.png" />
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .site-header {
        width: 100%;
        border-bottom: 1px solid var(--border-color);
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .site-header__brand {
        font-size: 0.9rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: linear-gradient(135deg, #ff0055, #ff6b35);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-decoration: none;
      }

      .site-header__back {
        font-size: 0.85rem;
        color: var(--text-secondary);
        text-decoration: none;
        transition: color 0.15s;
        margin-right: 3.5rem;
      }
      .site-header__back:hover { color: #ff0055; }

      .content {
        width: 100%;
        max-width: 720px;
        padding: 3rem 2rem 5rem;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      .content > header {
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 1.5rem;
      }

      .content > header h1 {
        font-size: 2rem;
        font-weight: 900;
        letter-spacing: 0.02em;
        margin-bottom: 0.4rem;
        color: var(--text-primary);
      }

      .content > header p {
        font-size: 0.82rem;
        color: var(--text-muted);
      }

      section {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }

      h2 {
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #ff0055;
      }

      p, li {
        font-size: 0.92rem;
        color: var(--text-secondary);
        line-height: 1.75;
      }

      ul {
        padding-left: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }

      a { color: var(--accent-light); text-decoration: none; }
      a:hover { text-decoration: underline; }

      @media (max-width: 500px) {
        .content { padding: 2rem 1.25rem 4rem; }
        .site-header { padding: 0.9rem 1.25rem; }
        .content > header h1 { font-size: 1.6rem; }
        .site-header__back { margin-right: 3rem; }
      }
    </style>
    <script type="module" crossorigin src="/dars-islam/assets/privacy-BeSevKIT.js"></script>
    <link rel="modulepreload" crossorigin href="/dars-islam/assets/Locale-DRE6GHvG.js">

    <link rel="stylesheet" crossorigin href="/dars-islam/assets/Locale-cUHdOL2G.css">
  </head>
  <body>
    <header class="site-header">
      <a href="/dars-islam/" class="site-header__brand">dars-islam</a>
      <div id="langPicker" style="margin:0 8px"></div>
      <a href="/dars-islam/" class="site-header__back" id="backLink">← Back to games</a>
    </header>

    <main class="content">
      <header>
        <h1 id="pageTitle">Privacy Policy</h1>
        <p id="pageUpdated">Last updated: June 28, 2026</p>
      </header>

      <div id="sections"></div>
    </main>

  </body>
</html>

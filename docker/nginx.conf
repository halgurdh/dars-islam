# darsislam.Games is a multi-page static site — the wrapper hub, each of
# its sub-pages (dashboard/teacher/parent/terms/privacy), and every game
# are all real directories with their own index.html. No SPA-style
# catch-all rewrite is needed; this is just a plain static file server
# with sane caching for service workers.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # PWA service workers must never be cached long-term, or returning
    # visitors won't pick up updates to the games they've installed.
    location ~* sw\.js$ {
        add_header Cache-Control "no-cache";
    }
}
